name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Ideally the git commands that build a small repository showing the problem.
      placeholder: "git init demo && cd demo\ngit commit --allow-empty -m one\n…"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version (gitcraft --version) and git --version
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Operating system
      placeholder: "Arch Linux, Wayland"
  - type: textarea
    id: logs
    attributes:
      label: Terminal output or logs (remove tokens and private paths)
      render: text
