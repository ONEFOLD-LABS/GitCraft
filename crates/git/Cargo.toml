[package]
name = "gitcraft-git"
description = "Git-Schicht: ruft git auf, liest die Ausgabe in Domänentypen"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[target.'cfg(unix)'.dependencies]
# Ends git's whole process group on cancel (hooks, ssh, helpers), without unsafe code.
rustix = { version = "1", default-features = false, features = ["std", "process"] }

[dev-dependencies]
tempfile = "3"
