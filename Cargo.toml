[workspace]
resolver = "3"
members = ["apps/*", "crates/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
gitcraft-core = { path = "crates/core" }
gitcraft-git = { path = "crates/git" }
gitcraft-graph = { path = "crates/graph" }
gitcraft-ui = { path = "crates/ui" }

[profile.release]
lto = "thin"
codegen-units = 1
